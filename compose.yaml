name: buteco-fighting

services:
  buteco-fighting:
    image: buteco-fighting:latest
    build:
      context: .
    container_name: buteco-fighting
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "80"
      RANKING_DB: /data/rankings.sqlite
    volumes:
      - online-data:/data
    expose:
      - "80"
    networks:
      - bender-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bender-network:
    external: true

volumes:
  online-data:
