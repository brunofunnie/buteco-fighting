name: buteco-fighting
services:
  buteco-fighting:
    image: ${BUTECO_IMAGE:-brunofunnie/buteco-fighting}:${BUTECO_TAG:-latest}
    pull_policy: always
    container_name: buteco-fighting
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "80"
      RANKING_DB: /data/rankings.sqlite
      TRUSTED_PROXY_IPS: ${BUTECO_TRUSTED_PROXY_IPS:-}
    volumes:
      - online-data:/data
    expose:
      - "80"
    networks:
      - bender-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  bender-network:
    external: true
volumes:
  online-data:
    external: true
    name: ${BUTECO_DATA_VOLUME:-buteco-fighting_online-data}
